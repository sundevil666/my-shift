name: Android release

on:
  push:
    branches: [main]

concurrency:
  group: android-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set release version
        run: |
          echo "RELEASE_VERSION_CODE=$((GITHUB_RUN_NUMBER + 1000))" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=0.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run check
      - name: Restore release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > src-capacitor/android/my-shift-release.jks
          printf 'storeFile=my-shift-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" \
            > src-capacitor/android/keystore.properties
      - run: npm run build:android
      - name: Prepare release assets
        run: |
          cp src-capacitor/android/app/build/outputs/apk/release/app-release.apk my-shift-android.apk
          node scripts/create-release-manifest.mjs \
            my-shift-android.apk mobile-releases.json \
            "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/my-shift-android.apk"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ env.RELEASE_VERSION_CODE }}
          name: My Shift Android ${{ env.RELEASE_VERSION }}
          make_latest: true
          generate_release_notes: true
          files: |
            my-shift-android.apk
            mobile-releases.json
